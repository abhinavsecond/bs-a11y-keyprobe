<!DOCTYPE html><html><head><title>a11y proxyMap mimetype battery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 id="h1">mimetype battery</h1>
<img src="own-asset.png" alt="">
<iframe src="frameC.html" width="40" height="40" title="control frame"></iframe>
<div id="dyn"></div>
<button>no label</button><input type="text">
<script>
(async function () {
  var A = 'https://accessibility.browserstack.com/';
  try {
    await navigator.serviceWorker.register('sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    for (var i = 0; i < 40 && !navigator.serviceWorker.controller; i++) await new Promise(function (r) { setTimeout(r, 100) });
    var h = '';
    h += '<link rel="stylesheet" href="' + A + 'mt-link-stylesheet.js">';
    h += '<link rel="preload" as="script" href="' + A + 'mt-preload-script.js">';
    h += '<link rel="modulepreload" href="' + A + 'mt-modulepreload.js">';
    h += '<script src="' + A + 'mt-classic-script.js"><\/script>';
    h += '<script type="module" src="' + A + 'mt-module-script.js"><\/script>';
    h += '<img src="' + A + 'mt-img.js" alt="">';
    h += '<iframe src="' + A + 'mt-iframe.js" width="30" height="30" title="mt-iframe"></iframe>';
    h += '<video><source src="' + A + 'mt-video.js"></video>';
    h += '<object data="' + A + 'mt-object.js" width="20" height="20"></object>';
    h += '<link rel="prefetch" href="' + A + 'mt-prefetch.js">';
    document.getElementById('dyn').innerHTML = h;
    try { await fetch(A + 'mt-fetch.js') } catch (e) {}
    try { var w = new Worker(A + 'mt-worker.js'); setTimeout(function () { try { w.terminate() } catch (e) {} }, 1500) } catch (e) {}
    var d = document.createElement('div'); d.textContent = 'MT_BATTERY_DONE controller=' + !!navigator.serviceWorker.controller; document.body.appendChild(d);
  } catch (e) { }
})();
</script>
</body></html>
