<!DOCTYPE html><html><head><title>a11y proxymap key/bytes split probe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 id="h1">proxyMap key/bytes decoupling probe (SW split)</h1>
<img src="own-asset.png" alt="">
<iframe src="frameC.html" width="50" height="50" title="own frame control"></iframe>
<div id="dyn"></div>
<button>no label</button>
<input type="text">
<script>
(async function () {
  var log = function (m) { var d = document.createElement('div'); d.textContent = m; document.body.appendChild(d) };
  try {
    await navigator.serviceWorker.register('sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    for (var i = 0; i < 40 && !navigator.serviceWorker.controller; i++) await new Promise(function (r) { setTimeout(r, 100) });
    log('SW_CONTROLLED=' + !!navigator.serviceWorker.controller);
    // Only NOW reference the browserstack URLs, so every one of them is served by my SW.
    document.getElementById('dyn').innerHTML =
      '<link rel="stylesheet" href="https://accessibility.browserstack.com/env.js">' +
      '<link rel="stylesheet" href="https://accessibility.browserstack.com/swsplit-probe.css">' +
      '<link rel="stylesheet" href="https://static-assets.browserstack.com/accessibility/theme-loader.js">' +
      '<iframe src="https://accessibility.browserstack.com/swsplit-probe.html" width="40" height="40" title="swsplit iframe"></iframe>' +
      '<img src="https://accessibility.browserstack.com/swsplit-probe.css" alt="">';
    // also exercise a plain fetch, in case dom-forge harvests from the page context
    try { var r = await fetch('https://accessibility.browserstack.com/env.js'); log('FETCH_ENVJS=' + (await r.text()).slice(0, 40)) } catch (e) { log('FETCH_ERR=' + e) }
  } catch (e) { log('SW_ERR=' + e) }
})();
</script>
</body></html>
